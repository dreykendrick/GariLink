# Disposable Linux CI only. Socket belongs to the runner, no TCP listener.
Foreground yes
LocalSocket /tmp/garilink-clamd/clamd.sock
LocalSocketMode 0600
FixStaleSocket yes
DatabaseDirectory /var/lib/clamav
LogFile /tmp/garilink-clamd/clamd.log
LogFileMaxSize 1M
LogTime yes
StreamMaxLength 5M
MaxFileSize 5M
MaxScanSize 20M
MaxRecursion 8
MaxScanTime 5000
MaxThreads 2
MaxQueue 4
ReadTimeout 10
CommandReadTimeout 10
AlertExceedsMax yes
