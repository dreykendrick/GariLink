// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
  }
}

allprojects {
  if (project.name == "react-native-reanimated") {
    project.buildDir = "E:/b/reanimated"
  }

  afterEvaluate { proj ->
    if (proj.name == "react-native-reanimated" && proj.hasProperty("android")) {
      proj.android.externalNativeBuild.cmake.buildStagingDirectory = proj.file("E:/b/reanimated-cxx")
    }
  }

  repositories {
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }

  tasks.withType(JavaCompile).configureEach {
    javaCompiler.set(null)
  }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"

